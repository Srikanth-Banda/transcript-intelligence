[project]
name = "transcript-intelligence"
version = "0.1.0"
description = "Transcript Intelligence take-home: call type, themes and sentiment pipeline"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pandas",
  "matplotlib",
  "pydantic>=2",
  "openai>=1.40",
  "python-dotenv",
  "tqdm",
  "jupyter",
  "ipykernel",
  "nbformat",
  "nbconvert",
  "pytest",
]

[project.optional-dependencies]
obs = ["langfuse"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ti"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
